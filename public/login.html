<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Smart Health Appointment System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-main">
      <div class="text-center mb-3">
        <a class="brand-logo" href="/">
          <span class="brand-mark"><i class="fa-solid fa-heart-pulse"></i></span>
          <span>Smart Health Appointment System</span>
        </a>
      </div>

      <div class="auth-card">
        <h1 class="h5 mb-1">Login</h1>
        <p class="text-muted mb-3" style="font-size:.86rem;">Sign in to your patient, doctor or administrator account.</p>

        <div id="loginAlert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-regular fa-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
            </div>
          </div>
          <button class="btn btn-primary w-100 py-2 mt-2" type="submit" id="loginBtn">
            <span class="spinner-border spinner-border-sm me-2 d-none" id="loginSpinner"></span>
            <span id="loginBtnText">Sign in</span>
          </button>
        </form>

        <p class="text-center text-muted mt-3 mb-0" style="font-size:.82rem;">
          New patient? <a href="/register.html" class="fw-semibold">Create an account</a>
        </p>

        <div class="demo-cred mt-3">
          <div class="fw-semibold mb-2" style="font-size:.76rem;color:#475569;"><i class="fa-solid fa-circle-info me-1 text-primary"></i>Demo accounts</div>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-outline-primary demo-fill" data-email="ravi.patient@smarthealth.com" data-password="Patient@123">Patient</button>
            <button type="button" class="btn btn-outline-primary demo-fill" data-email="ananya.doctor@smarthealth.com" data-password="Doctor@123">Doctor</button>
            <button type="button" class="btn btn-outline-primary demo-fill" data-email="admin@smarthealth.com" data-password="Admin@123">Admin</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
