<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Doctors · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" style="display:none" data-title="Find Doctors" data-subtitle="Search doctors and book an available time slot">
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-lg-5">
            <label class="form-label" for="searchInput">Search by name or speciality</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" class="form-control" id="searchInput" placeholder="e.g. Sharma, Cardiologist">
            </div>
          </div>
          <div class="col-lg-4">
            <label class="form-label" for="specFilter">Specialisation</label>
            <select class="form-select" id="specFilter">
              <option value="">All specialisations</option>
            </select>
          </div>
          <div class="col-lg-3 d-flex gap-2">
            <button class="btn btn-primary flex-grow-1" id="applyFilter"><i class="fa-solid fa-filter me-2"></i>Filter</button>
            <button class="btn btn-outline-secondary" id="resetFilter" title="Reset filters"><i class="fa-solid fa-rotate-left"></i></button>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="text-muted small" id="resultCount">Loading doctors...</div>
      <div class="small text-muted"><i class="fa-solid fa-circle-info me-1"></i>Only available slots are shown when you open a doctor</div>
    </div>

    <div class="row g-4" id="doctorsGrid"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/patient-doctors.js"></script>
</body>
</html>
