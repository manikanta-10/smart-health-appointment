<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Dashboard · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" style="display:none" data-title="Patient Dashboard" data-subtitle="Your upcoming appointments and history">
    <div class="card mb-4">
      <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div>
          <div class="text-muted small">Welcome</div>
          <h2 class="h5 mb-1" id="welcomeName">Hello!</h2>
          <p class="text-muted mb-0 small">View your appointments or book a new visit.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <a href="/patient/doctors.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-user-doctor me-1"></i>Find Doctors</a>
          <a href="/patient/doctors.html" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-calendar-plus me-1"></i>Book Appointment</a>
          <a href="/patient/profile.html" class="btn btn-outline-secondary btn-sm"><i class="fa-regular fa-user me-1"></i>Manage Profile</a>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fa-regular fa-calendar-check me-2 text-primary"></i>Upcoming appointments</span>
        <a href="/patient/appointments.html" class="small">View all</a>
      </div>
      <div class="card-body" id="nextAppointment">
        <div class="loading-box"><span class="spinner-border spinner-border-sm text-primary"></span> Loading...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Appointment history</span>
        <a href="/patient/appointments.html" class="small">Full history</a>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead><tr><th>Doctor</th><th>Specialization</th><th>Date &amp; time</th><th>Status</th></tr></thead>
          <tbody id="recentTable">
            <tr><td colspan="4"><div class="loading-box"><span class="spinner-border spinner-border-sm text-primary"></span> Loading...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/patient-dashboard.js"></script>
</body>
</html>
