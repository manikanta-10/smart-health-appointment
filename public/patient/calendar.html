<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Calendar · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <div id="page-content" style="display:none" data-title="Booking Calendar" data-subtitle="Click any available slot to book instantly">
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <label class="form-label" for="doctorSelect">Select a doctor</label>
            <select class="form-select" id="doctorSelect">
              <option value="">Loading doctors...</option>
            </select>
          </div>
          <div class="col-md-6">
            <div class="d-flex flex-wrap gap-3 small text-muted align-items-center h-100 pb-1">
              <span><span class="legend-dot" style="background:#d8f3ee;border:1px solid #0f9b8e;"></span>Available slot</span>
              <span><i class="fa-solid fa-hand-pointer me-1"></i>Click a slot to book</span>
              <span><i class="fa-solid fa-shield-halved me-1"></i>Occupied slots are hidden</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="calendar-card">
      <div id="patientCalendar"></div>
    </div>

    <div class="alert alert-info mt-3 mb-0" style="font-size:.8rem;">
      <i class="fa-solid fa-circle-info me-2"></i>Only free slots are displayed. The calendar shows IST times. A maximum of 2 appointments with the same doctor per calendar week is allowed.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/patient-calendar.js"></script>
</body>
</html>
