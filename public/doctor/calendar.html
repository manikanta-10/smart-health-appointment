<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Calendar · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <div id="page-content" style="display:none" data-title="My Calendar" data-subtitle="Day, week and month view of your booked and available slots">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div class="d-flex flex-wrap gap-3 small text-muted">
        <span><span class="legend-dot" style="background:#2563eb;"></span>Booked</span>
        <span><span class="legend-dot" style="background:#0f9b8e;"></span>Confirmed</span>
        <span><span class="legend-dot" style="background:#64748b;"></span>Completed</span>
        <span><span class="legend-dot" style="background:#dc2626;"></span>Cancelled</span>
        <span><span class="legend-dot" style="background:#d8f3ee;border:1px solid #0f9b8e;"></span>Free slot</span>
      </div>
      <div class="small text-muted"><i class="fa-solid fa-circle-info me-1"></i>Click an appointment to view details and update its status</div>
    </div>

    <div class="calendar-card">
      <div id="doctorCalendar"></div>
    </div>

    <div class="alert alert-info mt-3 mb-0" style="font-size:.8rem;">
      <i class="fa-solid fa-shield-halved me-2"></i>You only see your own appointments. Free slots are generated from your working hours and appointment duration. All times are in IST.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/doctor-common.js"></script>
  <script src="/js/doctor-calendar.js"></script>
</body>
</html>
