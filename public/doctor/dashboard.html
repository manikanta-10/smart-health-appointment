<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" style="display:none" data-title="Doctor Dashboard" data-subtitle="Your appointment schedule">
    <div class="card mb-4">
      <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div>
          <h2 class="h5 mb-1" id="doctorName">Welcome, Doctor</h2>
          <p class="text-muted mb-0 small" id="doctorSpeciality">Loading profile...</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <a href="/doctor/availability.html" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-clock me-1"></i>Manage Availability</a>
          <a href="/doctor/appointments.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-clipboard-list me-1"></i>Appointment History</a>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fa-solid fa-calendar-day me-2 text-primary"></i>Today's appointments <span class="text-muted fw-normal small" id="todayLabel"></span></span>
        <a href="/doctor/appointments.html" class="small">All appointments</a>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead><tr><th>Time</th><th>Patient</th><th>Status</th><th class="text-end">Action</th></tr></thead>
          <tbody id="todayTable">
            <tr><td colspan="4"><div class="loading-box"><span class="spinner-border spinner-border-sm text-primary"></span> Loading...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fa-solid fa-forward me-2 text-primary"></i>Upcoming appointments</span>
        <a href="/doctor/patients.html" class="small">My patients</a>
      </div>
      <div class="card-body" id="upcomingList">
        <div class="loading-box"><span class="spinner-border spinner-border-sm text-primary"></span> Loading...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/doctor-common.js"></script>
  <script src="/js/doctor-dashboard.js"></script>
</body>
</html>
