<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" style="display:none" data-title="Manage Availability" data-subtitle="Set working days, hours and consultation duration">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header"><i class="fa-solid fa-hourglass-half me-2 text-primary"></i>Consultation settings</div>
          <div class="card-body">
            <label class="form-label" for="durationSelect">Appointment duration</label>
            <select class="form-select" id="durationSelect">
              <option value="10">10 minutes</option>
              <option value="15">15 minutes</option>
              <option value="20">20 minutes</option>
              <option value="30">30 minutes</option>
              <option value="45">45 minutes</option>
              <option value="60">60 minutes</option>
              <option value="90">90 minutes</option>
              <option value="120">120 minutes</option>
            </select>
            <div class="form-text">Slots are generated on this grid inside each working range. Changing this affects future bookable slots only.</div>
            <div class="alert alert-info mt-3 mb-0" style="font-size:.78rem;">
              <i class="fa-solid fa-circle-info me-1"></i>Patients only see slots that are inside your working ranges and are not already booked.
            </div>
          </div>
        </div>

        <div class="card mt-4">
          <div class="card-header"><i class="fa-solid fa-wand-magic-sparkles me-2 text-primary"></i>Shortcuts</div>
          <div class="card-body d-flex flex-column gap-2">
            <button class="btn btn-outline-primary btn-sm" id="copyMonday"><i class="fa-solid fa-copy me-2"></i>Copy Monday to Tue-Fri</button>
            <button class="btn btn-outline-secondary btn-sm" id="clearAll"><i class="fa-solid fa-eraser me-2"></i>Clear all working hours</button>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fa-regular fa-calendar-days me-2 text-primary"></i>Weekly working hours</span>
            <span class="small text-muted">All times IST</span>
          </div>
          <div class="card-body">
            <div id="schedule">
              <div class="loading-box"><span class="spinner-border spinner-border-sm text-primary"></span> Loading schedule...</div>
            </div>
            <div class="d-flex justify-content-end mt-3">
              <button class="btn btn-primary" id="saveAvailability">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="saveSpinner"></span>
                <i class="fa-solid fa-floppy-disk me-2"></i>Save availability
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/doctor-availability.js"></script>
</body>
</html>
