<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration · Smart Health Appointment System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-main">
      <div class="text-center mb-3">
        <a class="brand-logo" href="/">
          <span class="brand-mark"><i class="fa-solid fa-heart-pulse"></i></span>
          <span>Smart Health Appointment System</span>
        </a>
      </div>

      <div class="auth-card">
        <h1 class="h5 mb-1">Patient Registration</h1>
        <p class="text-muted mb-3" style="font-size:.86rem;">Create a patient account to book appointments. Already registered? <a href="/login.html" class="fw-semibold">Login</a></p>

        <div id="registerAlert"></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="name">Full name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Ravi Verma" autocomplete="name" required>
          </div>
          <div class="row g-3">
            <div class="col-md-7">
              <label class="form-label" for="email">Email address</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="col-md-5">
              <label class="form-label" for="phone">Phone number</label>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="9876543210" autocomplete="tel" required>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
            </div>
            <div class="form-text">Use at least 8 characters with one letter and one number.</div>
          </div>
          <div class="mt-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary w-100 py-2 mt-3" type="submit" id="registerBtn">
            <span class="spinner-border spinner-border-sm me-2 d-none" id="registerSpinner"></span>
            <span id="registerBtnText">Create account</span>
          </button>
        </form>

        <div class="alert alert-info mt-3 mb-0 py-2" style="font-size:.8rem;">
          <i class="fa-solid fa-circle-info me-1"></i>Public registration is for patients only. Doctor accounts are created by the administrator.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
