<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Logs · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" style="display:none" data-title="SMS Logs" data-subtitle="Confirmation and reminder messages with delivery status">
    <div id="modeBanner" class="mb-4"></div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="stat-card"><span class="stat-icon teal"><i class="fa-solid fa-paper-plane"></i></span><div><div class="stat-value" id="statSent">-</div><div class="stat-label">Sent via Twilio</div></div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card"><span class="stat-icon amber"><i class="fa-solid fa-flask"></i></span><div><div class="stat-value" id="statSimulated">-</div><div class="stat-label">Simulated (not delivered)</div></div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card"><span class="stat-icon red"><i class="fa-solid fa-circle-exclamation"></i></span><div><div class="stat-value" id="statFailed">-</div><div class="stat-label">Failed</div></div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card"><span class="stat-icon slate"><i class="fa-solid fa-comment-sms"></i></span><div><div class="stat-value" id="statTotal">-</div><div class="stat-label">Total attempts</div></div></div></div>
    </div>

    <div class="card">
      <div class="card-header flex-wrap gap-2">
        <span><i class="fa-solid fa-comment-sms me-2 text-primary"></i>Message history</span>
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" id="filterStatus">
            <option value="">All statuses</option>
            <option value="sent">Sent</option>
            <option value="simulated">Simulated</option>
            <option value="failed">Failed</option>
          </select>
          <select class="form-select form-select-sm" id="filterType">
            <option value="">All types</option>
            <option value="confirmation">Confirmation</option>
            <option value="reminder">Reminder</option>
            <option value="cancellation">Cancellation</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr><th>Patient</th><th>Doctor</th><th>Appointment</th><th>Type</th><th>Status</th><th>Phone</th><th>Message</th><th>Logged at</th></tr>
          </thead>
          <tbody id="logsBody">
            <tr><td colspan="8"><div class="loading-box"><span class="spinner-border spinner-border-sm text-primary"></span> Loading logs...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/admin-sms-logs.js"></script>
</body>
</html>
