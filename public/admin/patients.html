<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" style="display:none" data-title="Patients" data-subtitle="Registered patient accounts and activity">
    <div class="card">
      <div class="card-header flex-wrap gap-2">
        <span><i class="fa-solid fa-users me-2 text-primary"></i>Patient accounts</span>
        <div class="d-flex gap-2 align-items-center">
          <span class="small text-muted" id="resultCount"></span>
          <input type="search" class="form-control form-control-sm" id="patientSearch" placeholder="Search name, email or phone..." style="min-width:250px;">
        </div>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr><th>Patient</th><th>Contact</th><th>Appointments</th><th>Completed</th><th>Last appointment</th><th>Joined</th><th>Status</th><th class="text-end">Action</th></tr>
          </thead>
          <tbody id="patientsBody">
            <tr><td colspan="8"><div class="loading-box"><span class="spinner-border spinner-border-sm text-primary"></span> Loading patients...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/admin-patients.js"></script>
</body>
</html>
