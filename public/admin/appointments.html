<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" style="display:none" data-title="Appointments" data-subtitle="All appointments with status management">
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">Doctor</label>
            <select class="form-select form-select-sm" id="filterDoctor"><option value="">All doctors</option></select>
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">Date</label>
            <input type="date" class="form-control form-control-sm" id="filterDate">
          </div>
          <div class="col-md-2">
            <label class="form-label small text-muted mb-1">Status</label>
            <select class="form-select form-select-sm" id="filterStatus">
              <option value="">All statuses</option>
              <option value="booked">Booked</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="col-md-4 d-flex gap-2">
            <button class="btn btn-primary btn-sm" id="applyFilters"><i class="fa-solid fa-filter me-1"></i>Apply</button>
            <button class="btn btn-outline-secondary btn-sm" id="resetFilters"><i class="fa-solid fa-rotate-left me-1"></i>Reset</button>
            <span class="small text-muted ms-auto align-self-center" id="resultCount"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><i class="fa-solid fa-clipboard-list me-2 text-primary"></i>Appointment list</div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr><th>Patient</th><th>Doctor</th><th>Date &amp; time</th><th>Reason</th><th>Status</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody id="appointmentsBody">
            <tr><td colspan="6"><div class="loading-box"><span class="spinner-border spinner-border-sm text-primary"></span> Loading appointments...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/admin-appointments.js"></script>
</body>
</html>
