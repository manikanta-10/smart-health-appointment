<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Calendar · Smart Health</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="page-content" style="display:none" data-title="Clinic Calendar" data-subtitle="All appointments across every doctor">
    <div class="card">
      <div class="card-header flex-wrap gap-2">
        <span><i class="fa-regular fa-calendar-days me-2 text-primary"></i>Appointment calendar</span>
        <div class="d-flex flex-wrap align-items-center gap-3">
          <div class="legend">
            <span><i class="legend-dot" style="background:#2563eb;"></i>Booked</span>
            <span><i class="legend-dot" style="background:#0f9b8e;"></i>Confirmed</span>
            <span><i class="legend-dot" style="background:#64748b;"></i>Completed</span>
            <span><i class="legend-dot" style="background:#dc2626;"></i>Cancelled</span>
          </div>
          <select class="form-select form-select-sm" id="doctorSelect" style="min-width:240px;">
            <option value="">All doctors</option>
          </select>
        </div>
      </div>
      <div class="card-body">
        <div id="adminCalendar"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/admin-calendar.js"></script>
</body>
</html>
